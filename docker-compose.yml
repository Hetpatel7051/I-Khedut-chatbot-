services:
  backend:
    image: python:3.10-slim
    container_name: ikhedut_backend
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-}
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-}
      - BHASHINI_ASR_SERVICE_ID=${BHASHINI_ASR_SERVICE_ID:-}
      - BHASHINI_TTS_SERVICE_ID=${BHASHINI_TTS_SERVICE_ID:-}
    ports:
      - "8080:8000"
    volumes:
      - .:/app

  frontend:
    image: node:22-alpine
    container_name: ikhedut_frontend
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - .:/app

